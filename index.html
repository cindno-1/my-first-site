<head>

  <title>My First Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fb;

      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 14px;

    p {

      font-size: 18px;

    .button {
      display: inline-block;
      background: #1d4ed8;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 8px;
      margin-top: 10px;
    }

<body>
  <div class="container">
    <h1>Hello! I'm Cindno-1</h1>

</html>
